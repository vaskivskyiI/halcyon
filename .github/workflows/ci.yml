name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci -w server -w web
      - run: sudo ./server/test/setup-dovecot.sh
      - run: ./server/test/setup-radicale.sh
      - run: npm test
        env: { TEST_DAV_URL: 'http://127.0.0.1:5232/alice/' }
      - run: npm run build
