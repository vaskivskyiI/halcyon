name: Android app
# Builds the Halcyon Android app (a Trusted Web Activity: your server full-screen with its own icon, launcher shortcuts
# and notifications) for ONE server address. Actions → "Android app" → Run workflow. See android/README.md.
# The signing key (needed so later builds can update the installed app) comes from the repository secrets
# ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD — it is never uploaded as an artifact.
on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Your Halcyon server, without https:// (e.g. mail.example.com)'
        required: true
      name:
        description: 'App name'
        default: 'Halcyon'
      package:
        description: 'Android package id'
        default: 'cc.halcyon.mail'
      version:
        description: 'Version (e.g. 1.0.0)'
        default: '1.0.0'
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HOST: ${{ inputs.host }}
      APP_NAME: ${{ inputs.name }}
      PKG: ${{ inputs.package }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools platforms;android-36 build-tools;36.1.0' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @bubblewrap/cli
      - name: Check inputs and signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ "$HOST" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]] || { echo "::error::host: a name like mail.example.com"; exit 1; }
          [[ "$PKG" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]] || { echo "::error::package: like cc.halcyon.mail"; exit 1; }
          if [ -z "$KS" ]; then
            echo "::error::Add the repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD first (see android/README.md)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/key" && echo "$KS" | base64 -d > "$RUNNER_TEMP/key/halcyon-android.keystore"
      - name: Build
        env:
          KEYDIR: ${{ runner.temp }}/key
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          T: ${{ runner.temp }}/android
        run: |
          export BW=$(command -v bubblewrap)
          bash android/build-local.sh | tee build.txt
          rm -rf "$RUNNER_TEMP/key"
          {
            echo "## Halcyon for Android — $HOST"
            echo "Install **Halcyon-$VERSION.apk** from the artifacts on the phone (allow installing from this source)."
            echo ""
            echo "So the app opens without a browser address bar, set on the server and restart it:"
            echo '```'
            grep '^HALCYON_ANDROID_' build.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: Halcyon-Android
          path: dist-apps/Halcyon-*
          if-no-files-found: error
