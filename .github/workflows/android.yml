name: Android app
# Builds the native Halcyon Android app (android/: your server in a WebView, with launcher shortcuts and notifications
# through Firebase Cloud Messaging). Actions → "Android app" → Run workflow. See android/README.md.
# The signing key (needed so later builds can update the installed app) comes from the repository secrets
# ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD, the Firebase file from GOOGLE_SERVICES_JSON_BASE64 — none
# of them is ever uploaded as an artifact.
on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Your Halcyon server, without https:// (pre-filled on the first start; optional)'
        required: false
      name:
        description: 'App name'
        default: 'Halcyon'
      package:
        description: 'Android package id (must match the app in your Firebase project)'
        default: 'cc.halcyon.mail'
      version:
        description: 'Version (e.g. 2.0.0)'
        default: '2.0.0'
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HOST: ${{ inputs.host }}
      APP_NAME: ${{ inputs.name }}
      PKG: ${{ inputs.package }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools platforms;android-36 build-tools;36.1.0' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Check inputs, signing key and Firebase file
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          [[ -z "$HOST" || "$HOST" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._/-]*)?$ ]] || { echo "::error::host: a name like mail.example.com"; exit 1; }
          [[ "$PKG" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]] || { echo "::error::package: like cc.halcyon.mail"; exit 1; }
          if [ -z "$KS" ]; then
            echo "::error::Add the repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD first (see android/README.md)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/key" && echo "$KS" | base64 -d > "$RUNNER_TEMP/key/halcyon-android.keystore"
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > "$RUNNER_TEMP/key/google-services.json"
          else echo "::warning::No GOOGLE_SERVICES_JSON_BASE64 secret: the app is built without notifications (see android/README.md)."; fi
      - name: Build
        env:
          KEYDIR: ${{ runner.temp }}/key
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ runner.temp }}/key/google-services.json
          T: ${{ runner.temp }}/android
        run: |
          export GRADLE=$(command -v gradle)
          bash android/build-local.sh | tee build.txt
          rm -rf "$RUNNER_TEMP/key"
          {
            echo "## Halcyon for Android"
            echo "Install **Halcyon-$VERSION.apk** from the artifacts on the phone (allow installing from this source)."
            grep -q 'with notifications' build.txt || echo "Built **without notifications**: add the GOOGLE_SERVICES_JSON_BASE64 secret (android/README.md)."
          } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: Halcyon-Android
          path: dist-apps/Halcyon-*.apk
          if-no-files-found: error
